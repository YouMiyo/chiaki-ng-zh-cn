name: Build Simplified Chinese Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize desktop submodules
        shell: pwsh
        run: git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl third-party/cpp-steam-tools
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git diffutils make unzip zip
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p python:p python-pip:p
            qt6-base:p qt6-declarative:p qt6-svg:p qt6-tools:p
            curl:p openssl:p opus:p speexdsp:p json-c:p miniupnpc:p protobuf:p libevent:p
            ca-certificates:p fast_float:p fftw:p lcms2:p libdovi:p meson:p nasm:p
            python-psutil:p python-glad:p python-jinja:p shaderc:p spirv-cross:p
            vulkan:p vulkan-headers:p compiler-rt:p
      - name: Prepare official-version build dependencies
        run: |
          python -m pip install protobuf pefile
          LIBPLACEBO_VERSION=275f7dea27924cdd34ab2e6c20e448b6bc4fab65 scripts/build-libplacebo-windows.sh .
          curl --fail --location --retry 3 -o ffmpeg-sdk.zip https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          echo 'ebf76dbec4e697bd71390c9e448487580020d3854422ed13544992b245b5c249  ffmpeg-sdk.zip' | sha256sum -c -
          unzip -q ffmpeg-sdk.zip
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/. /mingw64/bin
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/. /mingw64/include
          cp -a ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/. /mingw64/lib
          curl --fail --location --retry 3 -o official-runtime.zip https://github.com/chiaki-ng/chiaki-ng/releases/download/v1.10.1/chiaki-ng-win_x64-MSYS2-portable-1.10.1.zip
          echo '6ca3f5e6780608104d79345ab7755cfa77fefc33a41ae10651a874c43f54ea57  official-runtime.zip' | sha256sum -c -
          # Keep SDK tools on their own OpenSSL; isolate the app's upstream ABI.
          curl --fail --location --retry 3 -o openssl3-sdk.tar.zst https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-openssl-3.6.5-1-any.pkg.tar.zst
          echo '389d1af21e99223d9e2cd32d4c073131b276da85be7636bd8d23571f6938864f  openssl3-sdk.tar.zst' | sha256sum -c -
          mkdir openssl3-sdk
          tar -xf openssl3-sdk.tar.zst -C openssl3-sdk
      - name: Build pinned controller dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc
      - name: Build against matching core library versions
        run: |
          test "$(pkg-config --modversion Qt6Core)" = '6.12.0'
          test "$(pkg-config --modversion libplacebo)" = '7.387.0'
          test "$(pkg-config --modversion libavcodec)" = '63.1.102'
          python scripts/check-zh-translations.py
          cmake -S . -B build-aligned -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_TESTS=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DOPENSSL_ROOT_DIR="$PWD/openssl3-sdk/mingw64" -DOPENSSL_INCLUDE_DIR="$PWD/openssl3-sdk/mingw64/include" -DOPENSSL_CRYPTO_LIBRARY="$PWD/openssl3-sdk/mingw64/lib/libcrypto.dll.a" -DOPENSSL_SSL_LIBRARY="$PWD/openssl3-sdk/mingw64/lib/libssl.dll.a"
          cmake --build build-aligned --target chiaki --parallel 2
          curl --fail --location --retry 3 -o build-aligned/qtbase_zh_CN.ts https://raw.githubusercontent.com/qt/qttranslations/v6.12.0/translations/qtbase_zh_CN.ts
          echo 'e63a70eedd900438ec1c63877c525bcda5c8292803bf0e228995de09fb9ddeb7  build-aligned/qtbase_zh_CN.ts' | sha256sum -c -
          /mingw64/bin/lrelease.exe build-aligned/qtbase_zh_CN.ts -qm build-aligned/qtbase_zh_CN.qm
          pacman -Q > build-aligned/sdk-packages.txt
      - name: Reuse and verify original official runtime files
        run: python scripts/package-official-runtime.py
      - name: Package
        run: |
          cd dist-aligned
          zip -qr ../chiaki-ng-1.10.1-zh.2-windows-x64.zip chiaki-ng-Win
          cd ..
          sha256sum chiaki-ng-1.10.1-zh.2-windows-x64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-1.10.1-zh.2-windows-x64
          path: |
            chiaki-ng-1.10.1-zh.2-windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
